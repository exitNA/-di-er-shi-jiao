services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: second_perspective
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d second_perspective"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

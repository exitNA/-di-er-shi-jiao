name: second-perspective-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: second_perspective_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["54330:5432"]
    volumes: [postgres_test_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d second_perspective_test"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_test_data:
